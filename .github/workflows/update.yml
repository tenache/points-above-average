name: Update and publish

on:
  schedule:
    - cron: "47 9 * * *"  # every morning, 3+ hours after the last West Coast game ends; off the busy :00 and :30 slots, where GitHub delays or drops runs
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  # Fetches the new games and commits them. Only this job can write to the repo.
  update:
    if: github.event_name != 'push' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: fetch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Fetch new games
        # A game that fails is skipped and the step fails at the end; the others are kept.
        run: python -m paa.update
      - name: Save the games fetched so far
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new games."
            exit 0
          fi
          latest=$(ls data/games | sort | tail -1)
          git commit -m "Games through ${latest:0:4}-${latest:4:2}-${latest:6:2}"
          git pull --rebase
          git push

  # Builds the page from the tip of main (with the games just saved) and publishes it.
  build:
    # Built and uploaded in its own job: deploy-pages lists the run's artifacts once and gives up,
    # and a fresh upload isn't always listed yet in the same job (actions/deploy-pages#451).
    needs: update
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Overlapping runs build one at a time, so an older page is never published last.
    concurrency:
      group: pages-build
      cancel-in-progress: false
    # One artifact name per attempt: a re-run that rebuilds never meets the earlier attempt's upload.
    outputs:
      artifact: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the page's data
        # Exits with an error when there are no games, so an empty page is never published.
        run: python -m paa.update --no-fetch
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
          retention-days: 3  # so a deploy-only re-run still works a day or two later

  deploy:
    # When only this job failed, "Re-run failed jobs" re-runs just it, against the build above;
    # when update failed, build and deploy run again under the new attempt's artifact name.
    needs: build
    # Without this, the implicit success() also needs update, which is skipped on a push and
    # fails on a night with a bad game: the page would never be published then.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
